<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year Wishes</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container text-center py-5">
        <h1 class="display-1 text-primary fw-bold animate-text">🎉 Happy New Year 2025! 🎊</h1>
        <p class="lead text-secondary mt-3">Wishing you a year filled with joy, success, and unforgettable moments. ✨</p>

        <div class="row mt-5">
            <!-- <div class="col-md-6 mb-4">
                <img src="https://via.placeholder.com/300x200" class="img-fluid rounded animate-image" alt="New Year Celebration">
            </div> -->
            <div class="col-md-6">
                <div class="emoji-grid animate-emoji">
                    <span>🎆</span>
                    <span>🥳</span>
                    <span>🎇</span>
                    <span>🍾</span>
                    <span>🎁</span>
                    <span>💖</span>
                </div>
            </div>
        </div>

        <button id="showMessage" class="btn btn-success mt-4">Click for a Surprise 🎁</button>
        <p id="hiddenMessage" class="mt-4 text-warning d-none">You are amazing, and this year is going to be legendary! 🌟</p>

        <button id="generateFireworks" class="btn btn-primary mt-4">Generate Fireworks 🎆</button>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
